<div class="banner position-relative z-1">
  <div class="banner-overlay"></div>
  <div class="banner-pattern"></div>

  <div class="container">
    <div class="banner-content">
      <!-- Breadcrumb Navigation -->
      <nav class="banner-breadcrumb" aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a [routerLink]="['/']" class="breadcrumb-link">
              <span class="breadcrumb-icon">🏠</span>
              <span>{{ "banner.home" | translate }}</span>
            </a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current">{{ bannerTitle }}</span>
          </li>
        </ol>
      </nav>

      <!-- Main Title -->
      <div class="banner-title-wrapper">
        <h1 class="banner-title">
          <span class="title-line">{{ bannerTitle }}</span>
        </h1>
        <div class="title-underline"></div>
      </div>

      <!-- Decorative Elements -->
      <div class="banner-decorations">
        <div class="decoration-circle decoration-circle-1"></div>
        <div class="decoration-circle decoration-circle-2"></div>
        <div class="decoration-circle decoration-circle-3"></div>
      </div>
    </div>
  </div>
