<div class="row g-3 mt-4 justify-content-center">
  @for (team of teamData ; track $index) {

  <div class="col-lg-3 col-md-4 col-sm-6">
    <div  class="p-2 item">
      <figure class="imgHover overflow-hidden rounded-3">
        <img
          [src]="team.src"
          class="w-100 "
          [alt]="team.name"
          [title]="team.name"
        />
      </figure>
      <figcaption class="text-capitalize">
        <h5 class="textSecondColor fw-bold mb-0">{{ team.name }}</h5>
        <h6 class="textMainColor mb-0">{{ team.jobTitle }}</h6>
        <a class="text-decoration-none textMainColor" href="tel:{{ team.phone }}">{{ team.phone }}</a>
      </figcaption>
    </div>
  </div>
  }
</div>
